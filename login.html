<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Utileria.js | Login</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>

    <div class="contenedor-formulario">
        <h1>Iniciar Sesión</h1>
        <p class="subtitulo">Esta página usa <code>validarCorreo()</code> y <code>validarPassword()</code> de utileria.js.</p>

        <form id="formulario-login" novalidate>
            <div class="grupo-formulario">
                <label for="login-correo">Correo electrónico</label>
                <input type="text" id="login-correo" placeholder="Ej: correo@ejemplo.com" autocomplete="off">
                <span id="error-login-correo" class="mensaje-error"></span>
            </div>

            <div class="grupo-formulario">
                <label for="login-password">Contraseña</label>
                <input type="password" id="login-password" placeholder="Tu contraseña" autocomplete="off">
                <span id="error-login-password" class="mensaje-error"></span>
            </div>

            <button type="button" id="btn-login" class="boton-enviar">Iniciar sesión</button>
            <p id="mensaje-login-exito" class="mensaje-exito"></p>
        </form>
    </div>

    <script src="js/utileria.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const inputCorreo = document.getElementById('login-correo');
            const inputPassword = document.getElementById('login-password');
            const btnLogin = document.getElementById('btn-login');
            const mensajeExito = document.getElementById('mensaje-login-exito');
            const errorCorreo = document.getElementById('error-login-correo');
            const errorPassword = document.getElementById('error-login-password');

            btnLogin.addEventListener('click', () => {
                errorCorreo.textContent = '';
                errorPassword.textContent = '';
                mensajeExito.textContent = '';

                const correo = inputCorreo.value.trim();
                const password = inputPassword.value;

                const correoValido = validarCorreo(correo);
                const passwordValido = validarPassword(password);

                console.log('validarCorreo(correo):', correoValido);
                console.log('validarPassword(password):', passwordValido);

                let esValido = true;

                if (!correoValido) {
                    errorCorreo.textContent = 'Ingresa un correo electrónico válido.';
                    esValido = false;
                }

                if (!passwordValido) {
                    errorPassword.textContent = 'Debe tener 8+ caracteres, mayúscula, minúscula, número y símbolo.';
                    esValido = false;
                }

                if (esValido) {
                    console.log('✅ Login válido (simulado, sin backend). Redirigiendo a index.html...');
                    mensajeExito.textContent = '* Inicio de sesión exitoso...';
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1200);
                } else {
                    console.log('❌ Login inválido. Revisa los campos.');
                }
            });
        });
    </script>
</body>
</html>
